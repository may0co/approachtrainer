<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approach Trip Trainer</title>
<meta name="theme-color" content="#171C23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Approach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first training log that shares the trip boards' look.
   Cool grey field, condensed display type, one accent that follows the area you train for.
   The signature is the bolt line: 13 weeks drawn as bolts on a route, clipped as you finish them. */
:root {
  color-scheme: light;
  --bg: #E6E9ED;
  --surface: #F6F7F9;
  --raised: #FFFFFF;
  --ink: #171C23;
  --muted: #55606C;
  --rule: #D0D6DD;
  --good: #2B6A49;
  --warn: #9A5410;
  --bad: #A8371B;
  --acc-default: #24597A;
  --acc-rrg: #9A5410;
  --acc-nrg: #2E5B45;
  --acc-ic: #A63D1C;
  --accent: var(--acc-default);
  --on-accent: #FFFFFF;
  --s1: #1A6BB8;
  --s2: #C8621E;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --tabs-h: 4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12161B; --surface: #1A2027; --raised: #222A33; --ink: #E9EDF1; --muted: #9FAAB6; --rule: #313B46;
    --good: #7CC79C; --warn: #E0A05C; --bad: #EE8A6C;
    --acc-default: #7FB6D9; --acc-rrg: #E09A52; --acc-nrg: #86BD9F; --acc-ic: #E27B52; --on-accent: #12161B;
    --s1: #3F8FDB; --s2: #CC7636;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161B; --surface: #1A2027; --raised: #222A33; --ink: #E9EDF1; --muted: #9FAAB6; --rule: #313B46;
  --good: #7CC79C; --warn: #E0A05C; --bad: #EE8A6C;
  --acc-default: #7FB6D9; --acc-rrg: #E09A52; --acc-nrg: #86BD9F; --acc-ic: #E27B52; --on-accent: #12161B;
  --s1: #3F8FDB; --s2: #CC7636;
}
body[data-area="rrg"] { --accent: var(--acc-rrg); }
body[data-area="nrg"] { --accent: var(--acc-nrg); }
body[data-area="ic"] { --accent: var(--acc-ic); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 4rem; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(2.5rem, 10vw, 3.6rem); line-height: .92; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.top { position: sticky; top: 0; z-index: 20; background: var(--ink); color: var(--bg); }
.top-in { max-width: 44rem; margin: 0 auto; padding: .5rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3rem; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.45rem; text-transform: uppercase; letter-spacing: .03em; color: inherit; text-decoration: none; display: flex; align-items: center; gap: .5rem; }
.brand svg { width: 1.3rem; height: 1.3rem; }
.top .ctx { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; opacity: .8; text-align: right; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--raised); border-top: 1px solid var(--rule); }
.tabs-in { max-width: 44rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabs-h); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 500; position: relative; }
.tabs a svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem calc(var(--tabs-h) + 5.5rem); display: flex; flex-direction: column; gap: 1.6rem; }
.stack { display: flex; flex-direction: column; gap: .7rem; }
.row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Blocks */
.hero { display: flex; flex-direction: column; gap: .5rem; padding-bottom: 1rem; border-bottom: 3px solid var(--ink); }
.hero .mono { color: var(--accent); }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; }
.bignum { font-family: var(--display); font-weight: 700; font-size: 2.8rem; line-height: .9; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bignum small { display: block; font-family: var(--mono); font-size: .68rem; font-weight: 500; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; margin-top: .25rem; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-bottom: 2px solid var(--ink); padding-bottom: .35rem; flex-wrap: wrap; }
.sec-head .mono { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: .7rem; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; }
.card.key { border: 2px solid var(--accent); }
.card.flat { background: transparent; }
.pill { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--mono); font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; padding: .15rem .55rem; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink); white-space: nowrap; }
.pill.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pill.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill.good { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.pill.bad { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.pill.dash { border-style: dashed; border-color: var(--muted); }
.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent); border-radius: .6rem; padding: .55rem 1rem; min-height: 2.75rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; transition: transform .08s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: var(--raised); border-color: var(--rule); color: var(--ink); font-weight: 500; }
.btn.sm { min-height: 2.25rem; padding: .3rem .7rem; font-size: .88rem; border-radius: .5rem; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: .35rem 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: .9rem; }
.link.armed { color: var(--bad); font-weight: 600; }
.msg { background: var(--surface); border-left: 3px solid var(--accent); padding: .6rem .8rem; font-size: .92rem; border-radius: 0 .4rem .4rem 0; }
.msg.coach { border-left-color: var(--ink); }
.msg b { font-weight: 600; }
.why { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: .7rem; }
.foot { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 1rem; }
.banner { background: var(--ink); color: var(--bg); border-radius: .6rem; padding: .6rem .9rem; display: flex; justify-content: space-between; align-items: center; gap: .8rem; font-size: .9rem; flex-wrap: wrap; }
.banner button { color: inherit; }

/* Bolt line */
.bolts { display: flex; flex-direction: column; gap: .35rem; }
.bolt-row { display: grid; grid-template-columns: repeat(13, 1fr); align-items: center; position: relative; }
.bolt-row::before { content: ""; position: absolute; left: 3.8%; right: 3.8%; top: 50%; height: 2px; background: var(--rule); }
.bolt { position: relative; display: flex; justify-content: center; align-items: center; height: 2.2rem; background: none; border: 0; padding: 0; cursor: pointer; }
.bolt i { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--muted); background: var(--bg); display: block; transition: transform .12s; }
.bolt.done i { background: var(--ink); border-color: var(--ink); }
.bolt.part i { background: linear-gradient(90deg, var(--ink) 50%, var(--bg) 50%); border-color: var(--ink); }
.bolt.deload i { border-radius: 2px; width: 1rem; height: .45rem; }
.bolt.test i { border-radius: 2px; transform: rotate(45deg); }
.bolt.now i { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); background: var(--accent); }
.bolt.sel::after { content: ""; position: absolute; bottom: -.1rem; left: 25%; right: 25%; height: 3px; background: var(--ink); border-radius: 2px; }
.bolt-labels { display: grid; grid-template-columns: repeat(13, 1fr); font-family: var(--mono); font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.bolt-labels span { border-top: 2px solid var(--rule); padding-top: .25rem; margin: 0 1px; white-space: nowrap; overflow: hidden; }
.bolt-labels span.cur { border-top-color: var(--accent); color: var(--ink); }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .3rem; }
.day { background: var(--surface); border: 1px solid var(--rule); border-radius: .55rem; padding: .45rem .2rem; display: flex; flex-direction: column; gap: .15rem; align-items: center; text-align: center; min-height: 4.3rem; text-decoration: none; color: var(--ink); cursor: pointer; }
.day b { font-family: var(--display); font-size: 1.05rem; text-transform: uppercase; line-height: 1; }
.day em { font-style: normal; font-family: var(--mono); font-size: .62rem; color: var(--muted); }
.day span { font-size: .68rem; line-height: 1.15; color: var(--muted); overflow-wrap: anywhere; }
.day.today { border: 2px solid var(--accent); }
.day.done { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.day.done span, .day.done em { color: var(--bg); opacity: .8; }
.day.restd { background: transparent; border-style: dashed; }

/* Session parts */
ul.parts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
ul.parts li { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: .8rem; padding: .6rem 0; border-top: 1px solid var(--rule); font-size: .94rem; line-height: 1.45; }
ul.parts li b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; line-height: 1.2; }
ul.parts li small { display: block; font-family: var(--mono); font-size: .7rem; color: var(--muted); margin-top: .25rem; }
table.lift { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.lift td { padding: .45rem 0; border-top: 1px solid var(--rule); vertical-align: top; }
table.lift td:last-child { text-align: right; font-family: var(--mono); font-size: .8rem; white-space: nowrap; padding-left: .6rem; }
table.lift td small { display: block; color: var(--muted); font-size: .8rem; }
details.card > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: .7rem; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "+"; font-family: var(--display); font-size: 1.5rem; color: var(--muted); line-height: 1; flex: none; }
details.card[open] > summary::after { content: "–"; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: .88rem; text-decoration: underline; text-underline-offset: 2px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: .5rem; }
.dow { font-family: var(--display); font-weight: 700; font-size: 1.4rem; text-transform: uppercase; width: 3rem; flex: none; line-height: 1; }
.dow small { display: block; font-family: var(--mono); font-size: .62rem; font-weight: 500; color: var(--muted); margin-top: .15rem; }
.sum-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.sum-main b { font-weight: 600; }

/* Controls */
input, select, textarea { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: .5rem; padding: .45rem .6rem; width: 100%; min-height: 2.6rem; }
textarea { resize: vertical; min-height: 4rem; }
label.f { display: flex; flex-direction: column; gap: .2rem; font-size: .82rem; color: var(--muted); min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .8rem; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: .55rem; overflow: hidden; background: var(--raised); max-width: 100%; flex-wrap: wrap; }
.seg button { font-size: .88rem; border: 0; background: transparent; padding: .35rem .7rem; min-height: 2.4rem; min-width: 2.4rem; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.status button[aria-pressed="true"][data-v="s"] { background: var(--good); color: var(--on-accent); }
.seg.status button[aria-pressed="true"][data-v="t"] { background: var(--accent); color: var(--on-accent); }
.scale { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.scale button { border: 1px solid var(--rule); background: var(--raised); border-radius: .4rem; min-height: 2.5rem; cursor: pointer; font-family: var(--mono); font-size: .85rem; padding: 0; }
.scale button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scale.hot button[aria-pressed="true"].hi { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.step { display: inline-grid; grid-template-columns: 2.5rem minmax(2.6rem, auto) 2.5rem; align-items: center; border: 1px solid var(--rule); border-radius: .55rem; background: var(--raised); overflow: hidden; }
.step button { border: 0; background: transparent; min-height: 2.5rem; font-size: 1.2rem; cursor: pointer; }
.step b { text-align: center; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 .3rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { border: 1px solid var(--rule); background: var(--raised); border-radius: 999px; padding: .3rem .7rem; font-size: .84rem; cursor: pointer; min-height: 2.1rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip i { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .35rem; vertical-align: -1px; }

/* Logger */
.exo { background: var(--surface); border: 1px solid var(--rule); border-radius: .7rem; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .65rem; }
.exo.full { border-left: 4px solid var(--good); }
.exo-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; }
.exo-head h3 { font-size: 1.25rem; }
.exo-head .mono { color: var(--muted); text-align: right; flex: none; }
.sets { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.sets input { width: 3.2rem; text-align: center; font-family: var(--mono); padding: .4rem .2rem; }
.sets input.w { width: 4.6rem; }
.sets .x { color: var(--muted); font-family: var(--mono); }
.last { font-size: .84rem; color: var(--muted); }
.prob { display: grid; grid-template-columns: minmax(0, 1fr) 4.6rem; gap: .5rem; padding: .7rem 0; border-top: 1px solid var(--rule); }
.prob .ctl { grid-column: 1 / -1; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.sent-t { border: 1.5px solid var(--rule); background: var(--raised); border-radius: .55rem; min-height: 2.5rem; padding: 0 .8rem; cursor: pointer; font-weight: 600; font-size: .88rem; }
.sent-t[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.savebar { position: fixed; left: 0; right: 0; bottom: var(--tabs-h); z-index: 15; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--rule); }
.savebar-in { max-width: 44rem; margin: 0 auto; padding: .6rem 1rem; display: flex; gap: .6rem; align-items: center; }
.clock { font-family: var(--mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; min-width: 4.2rem; }
.rest { position: fixed; right: 1rem; bottom: calc(var(--tabs-h) + 4.4rem); z-index: 16; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: .5rem 1rem .5rem .55rem; display: flex; align-items: center; gap: .6rem; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.rest svg { width: 2.4rem; height: 2.4rem; transform: rotate(-90deg); }
.rest circle { fill: none; stroke-width: 4; }
.rest .trk { stroke: color-mix(in srgb, var(--bg) 25%, transparent); }
.rest .arc { stroke: var(--bg); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rest b { font-family: var(--mono); font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.rest small { display: block; font-size: .66rem; opacity: .75; }
.rest.done { background: var(--good); color: var(--on-accent); animation: pulse .7s ease-in-out 4; }
@keyframes pulse { 50% { transform: scale(1.07); } }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 1rem); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: .6rem; font-size: .92rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); max-width: calc(100% - 2rem); }

/* Check-in */
.ci { display: grid; grid-template-columns: 5.4rem minmax(0, 1fr); gap: .5rem .8rem; align-items: center; }
.ci > span { font-size: .88rem; color: var(--muted); }
.ci-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.ci-sum div { display: flex; flex-direction: column; }
.ci-sum b { font-family: var(--display); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ci-sum span { font-size: .72rem; color: var(--muted); }

/* Tiles and charts */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: .6rem; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.tile b { font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 1.05rem; color: var(--muted); font-weight: 600; }
.tile span { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.chart { position: relative; height: 9.5rem; display: grid; gap: 2px; align-items: end; border-bottom: 1px solid var(--muted); margin-left: 1.9rem; }
.chart .gl { position: absolute; left: -1.9rem; right: 0; border-top: 1px solid var(--rule); pointer-events: none; }
.chart .gl span { position: absolute; left: 0; top: -.55rem; font-family: var(--mono); font-size: .64rem; color: var(--muted); background: var(--surface); padding-right: .2rem; }
.col { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; z-index: 1; }
.col i { display: block; width: 42%; max-width: 1.1rem; border-radius: 4px 4px 0 0; min-height: 0; }
.col.one i { width: 62%; max-width: 1.6rem; }
.col i.a { background: var(--s1); }
.col i.b { background: var(--s2); }
.col.cur::after { content: ""; position: absolute; inset: 0 -1px; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 4px 4px 0 0; z-index: -1; }
.col:hover i, .col:focus i { filter: brightness(1.15); }
.xlab { display: grid; gap: 2px; margin-left: 1.9rem; font-family: var(--mono); font-size: .64rem; color: var(--muted); text-align: center; padding-top: .25rem; }
.xlab .cur { color: var(--ink); font-weight: 500; }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .35rem; vertical-align: -1px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .5rem; }
.mini { background: var(--surface); border: 1px solid var(--rule); border-radius: .6rem; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.mini .t { font-size: .8rem; color: var(--muted); line-height: 1.25; min-height: 2em; }
.mini .v { font-family: var(--display); font-weight: 700; font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.mini .v small { font-family: var(--body); font-size: .74rem; font-weight: 400; color: var(--muted); margin-left: .3rem; }
.mini .d { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.mini .d.up { color: var(--good); }
.spark { position: relative; height: 2.6rem; margin: .2rem .3rem; }
.spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.spark path { fill: none; stroke: var(--s1); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: var(--s1); opacity: .1; stroke: none; }
.spark .pt { position: absolute; width: .55rem; height: .55rem; margin: -.275rem; border-radius: 50%; background: var(--s1); border: 2px solid var(--surface); box-sizing: content-box; }
.spark .pt.end { width: .7rem; height: .7rem; margin: -.35rem; }
.spark .pt::after { content: ""; position: absolute; inset: -.6rem; }
.pyr { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) 4.6rem; gap: .35rem .6rem; align-items: center; font-size: .86rem; }
.pyr .g { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.pyr .bar { display: flex; gap: 2px; height: 1.05rem; }
.pyr .bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); }
.pyr .bar i.pj { background: repeating-linear-gradient(135deg, var(--s1) 0 2px, transparent 2px 5px); border: 1px solid var(--s1); }
.pyr .n { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-align: right; }
table.tests { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.tests th { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; padding: .3rem .2rem; }
table.tests td { border-top: 1px solid var(--rule); padding: .3rem .2rem; }
table.tests input { min-height: 2.2rem; padding: .25rem .4rem; font-family: var(--mono); font-size: .85rem; width: 100%; min-width: 3rem; }
.scrollx { overflow-x: auto; }
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: .35rem .55rem; border-radius: .4rem; max-width: 16rem; line-height: 1.35; white-space: pre-line; }

/* Log */
.entry { background: var(--surface); border: 1px solid var(--rule); border-radius: .7rem; }
.entry > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 3.3rem minmax(0, 1fr) auto; gap: .7rem; padding: .75rem 1rem; align-items: center; }
.entry > summary::-webkit-details-marker { display: none; }
.entry .d { font-family: var(--display); font-weight: 700; font-size: 1.2rem; text-transform: uppercase; line-height: 1; }
.entry .d small { display: block; font-family: var(--mono); font-size: .62rem; font-weight: 500; color: var(--muted); margin-top: .2rem; }
.entry .body { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: .6rem; font-size: .92rem; }
.entry p.note { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .8rem; }
.kv > div { display: contents; }
.kv span { border-top: 1px solid var(--rule); padding: .35rem 0; }
.kv span:nth-child(2) { font-family: var(--mono); font-size: .82rem; text-align: right; white-space: nowrap; }
.kv small { display: block; color: var(--muted); font-size: .8rem; white-space: pre-wrap; }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: .4rem; }

/* Areas */
.acard { text-decoration: none; color: var(--ink); }
.acard:hover { border-color: var(--accent); }
.acard h3 { font-size: 1.45rem; }
.bars { display: flex; flex-direction: column; gap: .55rem; }
.bar { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 3.4rem; gap: .7rem; align-items: center; font-size: .9rem; }
.track { height: .55rem; background: var(--rule); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .val { font-family: var(--mono); font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pips i { width: 1.4rem; height: .55rem; border-radius: 2px; background: var(--rule); }
.pips i.on { background: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); column-gap: 1.5rem; }
.fact { padding: .55rem 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: .1rem; font-size: .92rem; }
.fact b { font-weight: 600; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .75rem; align-items: start; padding: .6rem 0; border-top: 1px solid var(--rule); cursor: pointer; }
.check input { width: 1.35rem; height: 1.35rem; min-height: 0; margin: .15rem 0 0; accent-color: var(--accent); }
.check.on b { text-decoration: line-through; color: var(--muted); }
.cams { display: grid; grid-template-columns: repeat(auto-fit, minmax(4rem, 1fr)); gap: .4rem; }
.cam { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .5rem .2rem; border: 1px solid var(--rule); border-radius: .5rem; text-align: center; }
.cam i { width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 2px solid rgba(128, 128, 128, .4); }
.cam b { font-family: var(--display); font-size: 1.25rem; }
.cam span { font-size: .7rem; color: var(--muted); line-height: 1.2; }
.band h3 { font-size: 1.5rem; padding: .9rem 0 .3rem; border-bottom: 2px solid var(--ink); display: flex; gap: .7rem; align-items: baseline; }
.band h3 small { font-family: var(--mono); font-size: .74rem; font-weight: 500; color: var(--muted); text-transform: none; }
.route { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: .7rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--rule); }
.route .g { font-family: var(--display); font-weight: 700; font-size: 1.35rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.route .n { display: flex; flex-direction: column; min-width: 0; }
.route .n b { font-weight: 600; line-height: 1.25; }
.route .n span { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.route .n em { font-family: var(--mono); font-style: normal; font-size: .72rem; color: var(--accent); }

@media (min-width: 52rem) {
  .tabs { position: sticky; top: 3rem; bottom: auto; border-top: 0; border-bottom: 1px solid var(--rule); }
  .tabs-in { height: 3rem; }
  .tabs a { flex-direction: row; gap: .45rem; font-size: .9rem; }
  .tabs a svg { width: 1.15rem; height: 1.15rem; }
  .tabs a[aria-current="page"]::before { top: auto; bottom: -1px; border-radius: 3px 3px 0 0; }
  :root { --tabs-h: 0rem; }
  .wrap { padding-bottom: 7rem; }
}
@media (max-width: 30rem) {
  .bar { grid-template-columns: 6.6rem minmax(0, 1fr) 3rem; font-size: .84rem; }
  .route { grid-template-columns: 3rem minmax(0, 1fr); }
  .route .seg { grid-column: 2; justify-self: start; }
  .day span { display: none; }
  .day { min-height: 3.3rem; }
  ul.parts li { grid-template-columns: 1fr; gap: .15rem; }
  .tile b { font-size: 1.7rem; }
  .bolt-labels { font-size: .56rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
